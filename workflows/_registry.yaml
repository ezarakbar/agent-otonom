workflows:
  - id: cinematic_short
    title: Cinematic Short
    description: Brief produksi → konfirmasi → ComfyUI + SoVITS → pack siap upload.
    file: cinematic_short.py
    entry: run
    builtin: true

  - id: image_to_video
    title: Image Refine (opsional)
    description: Jalur sekunder — refine gambar user. Produksi utama = teks→AV generatif.
    file: image_to_video.py
    entry: run
    builtin: true

  - id: video_clipper
    title: Video Clipper
    description: Cut interesting segments from an input video into a highlight reel.
    file: video_clipper.py
    entry: run
    builtin: true
